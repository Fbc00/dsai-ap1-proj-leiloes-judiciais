services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/${GHCR_OWNER}/leiloes-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: prod
    env_file: .env
    environment:
      APP_ENV: prod
      DATABASE_URL: ${DATABASE_URL_MIGRATOR}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ghcr.io/${GHCR_OWNER}/leiloes-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: prod
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"

  nginx:
    image: ghcr.io/${GHCR_OWNER}/leiloes-nginx:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-7}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - backups:/backups
      - media:/data/media:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  media:
  backups:
