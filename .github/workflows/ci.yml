name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leiloes_owner
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: leiloes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leiloes_owner -d leiloes_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      LOG_LEVEL: WARNING
      DATABASE_URL: postgresql+asyncpg://leiloes_owner:ci@localhost:5432/leiloes_test
      DATABASE_URL_MIGRATOR: postgresql+asyncpg://leiloes_owner:ci@localhost:5432/leiloes_test
      DATABASE_URL_TEST: postgresql+asyncpg://leiloes_owner:ci@localhost:5432/leiloes_test
      LLM_PROVIDER: fake
      EMAIL_BACKEND: file
      POSTGRES_PASSWORD: ci
      DB_APP_PASSWORD: ci
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          MEDIA_ROOT: ${{ runner.temp }}/media

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: src/backend
          target: prod
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v7
        with:
          context: src
          file: src/frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
        working-directory: src/backend
      - run: uv run --with pip-audit pip-audit
        working-directory: src/backend
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend
      - run: pnpm audit --audit-level=high
        working-directory: src/frontend

  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: cp src/.env.example src/.env
      - run: docker compose -f src/docker-compose.yml up -d --build --wait
      - run: docker compose -f src/docker-compose.yml exec -T backend uv run alembic upgrade head
      - run: echo "admin12345" | docker compose -f src/docker-compose.yml exec -T backend uv run python -m app.cli criar-usuario admin --nome Admin --perfil admin --senha-stdin
      - name: Aguardar nginx responder pelo frontend
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost/ > /dev/null && exit 0
            sleep 5
          done
          echo "frontend nao respondeu em 5 minutos"
          docker compose -f src/docker-compose.yml logs frontend nginx
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/e2e/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: src/e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: src/e2e
      - run: pnpm test
        working-directory: src/e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/e2e/playwright-report
          retention-days: 7
      - if: always()
        run: docker compose -f src/docker-compose.yml down -v
